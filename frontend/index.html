<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vendor Onboarding Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="login-view" hidden>
    <h1>Vendor Onboarding Tracker</h1>
    <form id="login-form">
      <label>Coordinator
        <select id="username"><option>Linh</option><option>Huy</option><option>Mai</option></select>
      </label>
      <label>Password <input id="password" type="password" value="password"></label>
      <button type="submit">Log in</button>
      <p id="login-error" class="error"></p>
    </form>
  </section>

  <section id="app-view" hidden>
    <header>
      <h1>Vendor Onboarding Tracker</h1>
      <span>Logged in as <strong id="current-user"></strong> <button id="logout">Log out</button></span>
    </header>
    <p id="summary"></p>
    <p id="message" class="error"></p>
    <table>
      <thead>
        <tr><th>Vendor</th><th>Region</th><th>Coordinator</th><th>Stage</th><th>Days in stage</th><th>Move</th><th></th></tr>
      </thead>
      <tbody id="vendors"></tbody>
    </table>
  </section>

  <script src="app.js"></script>
</body>
</html>
